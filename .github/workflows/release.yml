name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          pip install requests zstandard python-gnupg pyinstaller

      - name: Build binary
        run: |
          make build

      - name: Rename binary to match install.sh expectation
        run: |
          mv dist/sven dist/sven-linux-x86_64

      - name: Generate SHA256
        run: |
          sha256sum dist/sven-linux-x86_64 > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sven-linux-x86_64
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AUR PKGBUILD checksums
        run: |
          CSUM=$(awk '{print $1}' dist/SHA256SUMS)
          sed -i "s/sha256sums=('SKIP')/sha256sums=('${CSUM}')/" PKGBUILD
          sed -i "s/pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" PKGBUILD

      - name: Publish AUR Package (sven-bin)
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: sven-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Release ${{ github.ref_name }}"
